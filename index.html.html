<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة حارس العالم الرقمي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap">
<style>
:root{--bg:#e9f1ff;--card:#fff;--ink:#0d1b4c;--mute:#51618f;--line:#c9d8f5;--blue:#1e6bff;--green:#16a870;--purple:#7a4dff;--bad:#e5484d;--glow:#ffd35a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081233;--card:#12214f;--ink:#eef3ff;--mute:#a7b6e3;--line:#2a3d7a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;background-image:radial-gradient(circle at 90% 5%,rgba(30,107,255,.25),transparent 40%),radial-gradient(circle at 5% 95%,rgba(122,77,255,.25),transparent 40%)}
main{max-width:820px;margin:0 auto;padding:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin:10px 0}
h1{font-size:clamp(1.8rem,6vw,2.8rem);margin:.2em 0;font-weight:900}h2{font-size:1.35rem;margin:.3em 0}
button{font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:12px 20px;color:#fff;background:var(--blue);box-shadow:0 4px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.5;cursor:not-allowed}
button.green{background:var(--green)}button.purple{background:var(--purple)}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}[hidden]{display:none!important}
input[type=text]{font-family:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.ic{width:56px;height:56px;object-fit:contain;vertical-align:middle}.ic.big{width:96px;height:96px}.ic.sm{width:34px;height:34px}.ic.huge{width:150px;height:150px}
.hero{text-align:center;padding:24px 10px}.hero .ic.big{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
.row{display:flex;gap:10px;flex-wrap:wrap}.gender label{flex:1;min-width:120px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-weight:700}
.gender input{position:absolute;opacity:0}.gender label:has(input:checked){border-color:var(--blue);background:rgba(30,107,255,.12)}
/* شريط المحطات */
#track{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px;background:var(--card);border:2px solid var(--line);border-radius:22px}
.st{text-align:center;flex:0 0 auto;width:74px;filter:grayscale(1) opacity(.5);transition:.4s}.st small{display:block;font-weight:700;font-size:.78rem;line-height:1.2}
.st.cur{filter:none;transform:scale(1.12)}.st.cur .ic{filter:drop-shadow(0 0 8px var(--blue))}.st.done{filter:none}.st.done::after{content:"✅";display:block;font-size:.8rem}
.ln{flex:1;height:4px;background:var(--line);border-radius:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pts{font-weight:900;font-size:1.2rem;color:var(--purple)}
.bar{height:10px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:100%;background:var(--green);transform-origin:right}
.q{font-size:1.25rem;font-weight:700}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;margin:8px 0;font-size:1.12rem}
.opt.sel{border-color:var(--blue);background:rgba(30,107,255,.14)}.opt.right{border-color:var(--green);background:rgba(22,168,112,.2)}.opt.wrong{border-color:var(--bad);background:rgba(229,72,77,.18)}
.fb{border-radius:16px;padding:14px;margin-top:12px;border:2px solid}.fb.ok{border-color:var(--green);background:rgba(22,168,112,.15)}.fb.no{border-color:var(--bad);background:rgba(229,72,77,.12)}
.ih{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center}.ih>div{flex:1}
.say{background:rgba(30,107,255,.08);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1.08rem;line-height:1.9;margin-top:10px}
.say ul,.say ol{padding:0;margin:10px 0;list-style:none;counter-reset:n}
.say li{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 46px 8px 12px;margin:8px 0;position:relative}
.say li::before{content:"●";position:absolute;right:16px;top:8px;color:var(--purple)}
.say ol li::before{counter-increment:n;content:counter(n);background:var(--purple);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;top:12px;right:10px}
@media (max-width:600px){.ih .ic.big{width:56px;height:56px}.ih h2{font-size:1.1rem}.say{font-size:1rem;padding:12px}}
button.st{background:none;box-shadow:none;color:var(--ink);padding:4px 2px;border-radius:14px;font-size:inherit}button.st:not(.lk):hover{background:rgba(30,107,255,.12)}.st.lk{cursor:not-allowed}.st span{display:block;font-size:.8rem}
/* سحب وتوصيل */
.mrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.mrow b{flex:1 1 140px}
.slot{flex:2 1 200px;min-height:50px;border:2px dashed var(--line);border-radius:12px;padding:4px;display:flex;align-items:center;color:var(--mute)}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;min-height:50px;padding:8px;border-radius:12px;background:rgba(122,77,255,.08)}
.chip{display:inline-block;padding:8px 14px;border-radius:12px;background:var(--purple);color:#fff;font-weight:700;cursor:grab;touch-action:none;user-select:none}.chip.pk{outline:3px solid var(--glow)}
.chip.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:50;opacity:.9}
.slot.good{border-color:var(--green)}.slot.bad{border-color:var(--bad)}
.ord{position:relative}.ord b{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:var(--purple);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.pwbox{direction:ltr;text-align:center;font-size:1.6rem;font-weight:900;min-height:56px;border:2px dashed var(--purple);border-radius:12px;margin:10px 0;padding:6px}
.chk{padding:0;margin:10px 0}.chk li{list-style:none}.chk .y{color:var(--green)}.chk .n{color:var(--mute)}
.bigbadge{text-align:center;animation:pop .8s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 24px var(--glow))}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.conf{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:fall 2.8s linear forwards;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf,.bigbadge,.hero .ic{animation:none}}
.bd{display:inline-block;margin:4px;text-align:center;width:84px;font-size:.78rem;font-weight:700}.bd .ic{filter:grayscale(1) opacity(.4)}.bd.on .ic{filter:drop-shadow(0 0 10px var(--glow))}
.sk{margin:10px 0}.sk .track{height:18px;border-radius:12px;background:var(--line);overflow:hidden}.sk .track i{display:block;height:100%;border-radius:12px}
.donut{width:150px;height:150px;border-radius:50%;margin:auto;display:grid;place-items:center;font-weight:900;font-size:1.6rem}.donut span{background:var(--card);width:110px;height:110px;border-radius:50%;display:grid;place-items:center}
.lb{padding:0}.lb li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;margin:4px 0;background:rgba(30,107,255,.08);list-style:none}.lb .me{background:rgba(255,211,90,.35);font-weight:900}
.mis{border-right:6px solid var(--bad);padding:8px 12px;margin:8px 0;background:rgba(229,72,77,.08);border-radius:10px}
#certbox{display:none}
.dip{box-sizing:border-box;width:297mm;height:209mm;padding:10mm;background:#fffdf4;font-family:'Cairo',Tahoma,sans-serif;color:#10206b;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dip-in{height:100%;border:3mm double #c9a227;outline:1.2mm solid #1e3fae;outline-offset:2mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:6mm 14mm}
.dip h1{font-size:46pt;margin:0;color:#1e3fae;line-height:1.1}.dip .sub{font-size:15pt;color:#7a4dff;font-weight:700}.dip p{margin:0;font-size:16pt}
.dip .nm{font-size:40pt;font-weight:900;color:#7a4dff;border-bottom:1.2mm solid #c9a227;padding:0 14mm;line-height:1.4}
.dip .bds{display:flex;gap:8mm;justify-content:center}.dip .b{width:36mm}.dip .b i{display:grid;place-items:center;width:20mm;height:20mm;margin:0 auto 2mm;border-radius:50%;border:1.2mm solid #c9a227;background:#fff8dc}.dip .b img{width:15mm}.dip .b span{font-size:10pt;font-weight:700}
.dip .sig{display:flex;justify-content:space-around;align-items:flex-end;width:100%;font-size:12pt}.dip .sig div{width:60mm;border-top:.4mm solid #10206b;padding-top:2mm}
@page{size:A4 landscape;margin:0}
@media print{main,#mute,.conf{display:none!important}#certbox{display:block!important}html,body{background:#fff!important;margin:0;padding:0}}
</style>
</head>
<body>
<main>
<section id="s-start" class="card hero">
  <div id="logo"></div><h1>مغامرة حارس العالم الرقمي</h1>
  <p>فيروس شرير اسمه «سارق البيانات» يحاول اختراق حسابات الأطفال المدرسية! اجتز ٤ تحديات، اجمع دروع الأمان لكي تصد الهجوم.</p>
  <div style="text-align:right;max-width:420px;margin:auto">
    <label for="nm"><b>اسمك الكامل</b></label><input type="text" id="nm" maxlength="40" autocomplete="off" placeholder="اكتب اسمك هنا">
    <p style="margin:14px 0 6px"><b>أنا</b></p>
    <div class="row gender"><label><input type="radio" name="g" value="m" checked>👦 ذكر</label><label><input type="radio" name="g" value="f">👧 أنثى</label></div>
    <p id="err" style="color:var(--bad);min-height:1.5em"></p><button id="go" class="green" style="width:100%">ابدأ المهمة 🚀</button>
  </div>
</section>
<div id="track" hidden></div>
<section id="s-intro" class="card" hidden></section>
<section id="s-game" hidden>
  <div class="card top"><div id="lvlname" style="font-weight:700"></div><div class="pts">⭐ <span id="pts">0</span></div></div>
  <div class="card">
    <div id="prog" style="color:var(--mute)"></div><div class="bar" title="وقت المكافأة السريعة"><i id="timer"></i></div>
    <div class="q" id="qtext"></div><div id="body"></div><div id="fb"></div>
    <div class="row" style="margin-top:14px"><button id="check" class="purple" hidden>تحقق من إجابتي ✔️</button><button id="next" class="green" hidden>التالي ◀</button></div>
  </div>
</section>
<section id="s-level" class="card" hidden style="text-align:center"></section>
<section id="s-dash" hidden></section>
</main>
<div id="certbox"></div>
<button id="mute" aria-label="كتم أو تشغيل الصوت" style="position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;z-index:20;padding:8px 12px">🔊</button>

 {s:3,type:'single',pts:10,tl:8,ic:'bug',title:'ثغرة 1: كلمة سر مكشوفة',text:'🐞 ثغرة 1: زميلك كتب كلمة سره على ورقة ملصقة على شاشة الكمبيوتر! ما الإصلاح؟',opts:['أغيّرها لكلمة قوية وأزيل الورقة','أتركها فهي تفيده','أصوّر الورقة وأرسلها لأصدقائه'],ok:0,ans:'تغيير كلمة السر لقوية وإزالة الورقة',exp:'كلمة السر لا تُكتب في مكان ظاهر للجميع.'},

 {s:3,type:'single',pts:10,tl:8,ic:'chat',title:'ثغرة 3: رسالة غريبة',text:'📩 ثغرة 3: رسالة من غريب: «أعطني كلمة سر حسابك المدرسي لتربح لعبة مجانية!» ما الإصلاح؟',opts:['أتجاهله وأحظره وأخبر معلمي أو ولي أمري','أعطيه نصف كلمة السر فقط','أعطيه كلمة السر لأحصل على اللعبة'],ok:0,ans:'التجاهل والحظر وإخبار المعلم أو ولي الأمر',exp:'لا تعطِ كلمة سرك لأحد أبداً، فالهدايا مقابل السر خدعة من سارق البيانات.'}
];
const TL={single:12,check:20,match:30,order:25,puzzle:30,build:40},BONUS=5;
/* صيغ المؤنث: أسماء الشارات وأفعال الأمر */
const BF=['المستكشفة الذكية','خبيرة الحماية','حارسة الأمان الرقمي','حارسة الدرع الأمني'];
const bn=i=>S.g==='f'?BF[i]:ST[i].b;
const FM={'اختر':'اختاري','اسحب':'اسحبي','المس':'المسي','تجنب':'تجنبي','اكتب':'اكتبي','أعد':'أعيدي','اقرأه':'اقرئيه','حاول':'حاولي','واصل':'واصلي','اجمع':'اجمعي'};
const gz=t=>S.g==='f'?t.replace(/[\u0621-\u064A]+/g,w=>FM[w]||w):t;

/* ============ الحالة والأدوات ============ */
const S={name:'',g:'m',qi:0,st:0,log:[],badges:[0,0,0,0],done:false,t0:0,lim:12,iv:null};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mix=a=>{a=a.map((t,i)=>({i,t}));for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const first=()=>S.name.split(' ')[0];
const praise=()=>S.g==='m'?`أحسنت يا ${esc(first())}! 🎉`:`أحسنتِ يا ${esc(first())}! 🎉`;
const oops=()=>S.g==='m'?`لا بأس يا بطل 💪`:`لا بأس يا بطلة 💪`;
const total=()=>S.log.reduce((a,x)=>a+x.pts+x.bonus,0);
function show(id){['start','intro','game','level','dash'].forEach(k=>$('#s-'+k).hidden=k!==id);$('#track').hidden=!['intro','game','level','dash'].includes(id);window.scrollTo(0,0)}
function track(){$('#track').innerHTML=ST.map((s,i)=>{const u=i===0||S.badges[i-1];return`<button class="st ${S.badges[i]?'done':i===S.st?'cur':''} ${u?'':'lk'}" data-i="${i}" ${u?'':'disabled'} aria-label="${s.st}" title="${u?'اضغط للانتقال إلى هذه المرحلة':'أكمل المرحلة السابقة لفتحها'}">${im(s.ic,'sm')}<small>${s.st}</small>${u?'':'<span>🔒</span>'}</button>`}).join('<span class="ln"></span>');document.querySelectorAll('#track .st').forEach(b=>b.onclick=()=>{if(!b.disabled)intro(+b.dataset.i)})}
$('#logo').innerHTML=im('lock','big');

/* ============ الأصوات (تُولَّد داخل المتصفح) ============ */
let AC=null,MUTED=false;
function tone(f,d,type='sine',at=0,v=.15){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={click:()=>tone(660,.07,'triangle',0,.1),right:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'sine',i*.09,.16)),wrong:()=>{tone(220,.22,'sawtooth',0,.09);tone(165,.32,'sawtooth',.2,.09)},badge:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',i*.12,.16));tone(1568,.7,'sine',.65,.14)}};
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx.click()});
$('#mute').onclick=()=>{MUTED=!MUTED;$('#mute').textContent=MUTED?'🔇':'🔊'};

/* ============ البداية والمحتوى التمهيدي ============ */
$('#go').onclick=()=>{
  const n=$('#nm').value.trim();if(n.length<2){$('#err').textContent='من فضلك اكتب اسمك الكامل أولاً.';return}
  S.name=n;S.g=document.querySelector('input[name=g]:checked').value;S.log=[];S.badges=[0,0,0,0];intro(0);
};
function nextStage(){const i=S.badges.findIndex(b=>!b);i<0?dashboard():intro(i)}
function intro(i){
  clearInterval(S.iv);S.st=i;track();show('intro');const L=ST[i],done=S.badges[i];
  $('#s-intro').innerHTML=`<div class="ih">${im(L.ic,'big')}<div><h2>${L.t}</h2><p style="color:var(--mute);margin:0">${gz('المحتوى التعليمي: اقرأه جيداً قبل التحدي')}</p></div>${im('robot','big')}</div>
  <div class="say">${gz(L.intro)}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button id="begin" class="green">${done?'العب هذه المرحلة مرة أخرى 🔄':'ابدأ التحدي 🚀'}</button>${done?`<button id="back" class="purple">${S.badges.every(Boolean)?'📊 لوحة إنجازاتي':'↩ العودة لمرحلتي الحالية'}</button>`:''}</div>`;
  $('#begin').onclick=()=>{const old=S.log.filter(x=>x.s===i);S.old=old.length&&done?{s:i,rows:old}:null;S.log=S.log.filter(x=>x.s!==i);S.qi=Q.findIndex(q=>q.s===i);show('game');loadQ()};
  if(done)$('#back').onclick=nextStage;
}

/* ============ عرض الأسئلة (ترتيب الخيارات عشوائي في كل مرة) ============ */
function loadQ(){
  const q=Q[S.qi];S.sel=new Set();S.slot={};S.pick=null;S.ord=[];S.pz=[];S.done=false;clearInterval(S.iv);
  $('#pts').textContent=total();$('#lvlname').textContent=ST[q.s].t;
  const inS=Q.filter(x=>x.s===q.s);$('#prog').textContent=`السؤال ${inS.indexOf(q)+1} من ${inS.length} في هذه المرحلة`;
  $('#qtext').textContent=gz(q.text);$('#fb').innerHTML='';$('#next').hidden=true;$('#check').hidden=q.type==='single';$('#check').disabled=true;
  const b=$('#body');b.innerHTML=q.ic?`<div style="text-align:center">${im(q.ic,'big')}</div>`:'';
  const R=document.createElement('div');b.append(R);
  if(q.type==='single')mix(q.opts).forEach(o=>R.append(btn(o.t,()=>{S.pk=o.i;grade(o.i===q.ok)},'o'+o.i)));
  if(q.type==='check')mix(q.opts).forEach(o=>{const e=btn(o.t,()=>{S.sel.has(o.i)?S.sel.delete(o.i):S.sel.add(o.i);e.classList.toggle('sel');e.textContent=(S.sel.has(o.i)?'☑ ':'☐ ')+o.t;$('#check').disabled=!S.sel.size},'o'+o.i);e.textContent='☐ '+o.t;R.append(e)});
  if(q.type==='match'){S.defs=mix(q.pairs.map(p=>p[1]));R.innerHTML='<div id="mt"></div><div class="pool" id="pool"></div>';drawMatch(q)}
  if(q.type==='order'){S.so=mix(q.steps);R.innerHTML='';S.so.forEach(o=>{const e=btn(o.t,()=>{const k=S.ord.indexOf(o.i);k<0?S.ord.push(o.i):S.ord.splice(k,1);drawOrder()},'o'+o.i);e.className+=' ord';R.append(e)});drawOrder()}
  if(q.type==='puzzle'){S.pcs=mix(q.pieces);R.innerHTML='<div class="pwbox" id="pwb"></div><div class="pool" id="pool"></div><ul class="chk" id="chk"></ul>';drawPz(q)}
  if(q.type==='build'){R.innerHTML='<input type="text" id="pw" dir="ltr" autocomplete="off" placeholder="اكتب كلمة المرور الجديدة"><ul class="chk" id="chk"></ul>';$('#pw').placeholder=gz('اكتب كلمة المرور الجديدة');$('#pw').oninput=()=>rules(q,$('#pw').value);rules(q,'');$('#check').disabled=false}
  S.lim=q.tl||TL[q.type];S.t0=Date.now();S.iv=setInterval(()=>{$('#timer').style.transform=`scaleX(${Math.max(0,1-(Date.now()-S.t0)/1000/S.lim)})`},100);$('#timer').style.transform='scaleX(1)';
}
function btn(t,f,id){const e=document.createElement('button');e.className='opt';e.textContent=t;e.onclick=f;if(id)e.id=id;return e}
function pwRules(p,ban){return[['٨ أحرف أو أكثر',p.length>=8],['حروف كبيرة وصغيرة',/[a-z]/.test(p)&&/[A-Z]/.test(p)],['أرقام',/\d/.test(p)],['رموز خاصة مثل ! # @',/[^A-Za-z0-9]/.test(p)],['بلا اسم أو أرقام متسلسلة',p.length>0&&!ban.test(p)]]}
function rules(q,p){$('#chk').innerHTML=pwRules(p,q.ban).map(([t,o])=>`<li class="${o?'y':'n'}">${o?'✅':'⬜'} ${t}</li>`).join('')}
function drawOrder(){const q=Q[S.qi];S.so.forEach(o=>{const e=$('#o'+o.i);const k=S.ord.indexOf(o.i);e.classList.toggle('sel',k>=0);e.innerHTML=o.t+(k>=0?`<b>${k+1}</b>`:'')});$('#check').disabled=S.ord.length<q.steps.length}
function drawPz(q){
  const p=S.pz.map(i=>q.pieces[i]).join('');$('#pwb').textContent=p||'—';
  $('#pool').innerHTML=S.pcs.map(o=>`<span class="chip ${S.pz.includes(o.i)?'pk':''}" data-p="${o.i}">${o.t}</span>`).join('');
  document.querySelectorAll('#pool .chip').forEach(c=>c.onclick=()=>{if(S.done)return;const i=+c.dataset.p,k=S.pz.indexOf(i);k<0?S.pz.push(i):S.pz.splice(k,1);drawPz(q)});
  rules(q,p);$('#check').disabled=!S.pz.length;
}
/* سحب وتوصيل: بالسحب أو بالمس */
function drawMatch(q){
  $('#mt').innerHTML=q.pairs.map((p,i)=>{const k=S.slot[i];return`<div class="mrow"><b>${p[0]}</b><div class="slot" data-i="${i}">${k!=null?`<span class="chip" data-k="${k}">${q.pairs[k][1]}</span>`:gz('اسحب التعريف إلى هنا')}</div></div>`}).join('');
  const used=Object.values(S.slot);$('#pool').innerHTML=S.defs.filter(d=>!used.includes(d.i)).map(d=>`<span class="chip ${S.pick===d.i?'pk':''}" data-k="${d.i}">${d.t}</span>`).join('');
  document.querySelectorAll('#s-game .slot').forEach(sl=>sl.onclick=()=>{if(S.pick!=null&&!S.done){putSlot(+sl.dataset.i,S.pick);S.pick=null}});
  document.querySelectorAll('#s-game .chip').forEach(c=>c.onpointerdown=e=>dragChip(e,c));
  $('#check').disabled=Object.keys(S.slot).length<q.pairs.length;
}
function putSlot(i,k){for(const j in S.slot)if(S.slot[j]===k)delete S.slot[j];S.slot[i]=k;drawMatch(Q[S.qi])}
function dragChip(e,c){
  if(S.done)return;const k=+c.dataset.k,sx=e.clientX,sy=e.clientY;let g=null,moved=false;
  const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;g=c.cloneNode(true);g.className='chip ghost';document.body.append(g)}if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}};
  const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(g)g.remove();
    if(moved){const t=document.elementFromPoint(ev.clientX,ev.clientY),sl=t&&t.closest('.slot');if(sl)putSlot(+sl.dataset.i,k)}
    else if(c.closest('.slot')){for(const j in S.slot)if(S.slot[j]===k)delete S.slot[j];drawMatch(Q[S.qi])}
    else{S.pick=S.pick===k?null:k;drawMatch(Q[S.qi])}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
}

/* ============ التصحيح التلقائي ============ */
$('#check').onclick=()=>{
  const q=Q[S.qi];let ok=false;
  if(q.type==='check'){ok=S.sel.size===q.good.length&&[...S.sel].every(i=>q.good.includes(i));q.opts.forEach((_,i)=>{const e=$('#o'+i);if(q.good.includes(i))e.classList.add('right');else if(S.sel.has(i))e.classList.add('wrong')})}
  if(q.type==='match'){ok=q.pairs.every((_,i)=>S.slot[i]===i);document.querySelectorAll('#s-game .slot').forEach(sl=>sl.classList.add(S.slot[sl.dataset.i]==sl.dataset.i?'good':'bad'))}
  if(q.type==='order')ok=q.steps.every((_,i)=>S.ord[i]===i);
  if(q.type==='puzzle')ok=pwRules(S.pz.map(i=>q.pieces[i]).join(''),q.ban).every(x=>x[1]);
  if(q.type==='build')ok=pwRules($('#pw').value,q.ban).every(x=>x[1]);
  grade(ok);
};
function grade(ok){
  if(S.done)return;S.done=true;clearInterval(S.iv);
  const q=Q[S.qi],sec=(Date.now()-S.t0)/1000,bonus=ok&&sec<=S.lim?BONUS:0;
  S.log.push({s:q.s,title:q.title,ok,pts:ok?q.pts:0,bonus,max:q.pts,ans:q.ans,exp:q.exp});
  document.querySelectorAll('#body button,#body input').forEach(e=>e.disabled=true);
  if(q.type==='single'){q.opts.forEach((_,i)=>{const e=$('#o'+i);if(i===q.ok)e.classList.add('right');else if(i===S.pk)e.classList.add('wrong')})}
  $('#fb').innerHTML=ok?`<div class="fb ok">${im('ok','sm')} <b>${praise()}</b> +${q.pts} نقطة${bonus?` + ${bonus} للسرعة ⚡`:''}<br>${q.exp}</div>`
   :`<div class="fb no">${im('no','sm')} <b>تنبيه! ${oops()}</b><br>الإجابة الصحيحة: ${q.ans}<br>${q.exp}</div>`;
  $('#check').hidden=true;$('#next').hidden=false;$('#next').focus();$('#pts').textContent=total();
  setTimeout(()=>sfx[ok?'right':'wrong'](),120);
}
$('#next').onclick=()=>{const c=Q[S.qi],n=Q[S.qi+1];if(!n||n.s!==c.s)return endStage(c.s);S.qi++;loadQ()};

/* ============ نهاية المرحلة والشارات ============ */
function endStage(s){
  const L=ST[s],rows=S.log.filter(x=>x.s===s),got=rows.reduce((a,x)=>a+x.pts,0),max=rows.reduce((a,x)=>a+x.max,0),had=S.badges[s],pass=got/max>=.5||had,last=s===3,sec=$('#s-level');let kept=false;
  if(S.old&&S.old.s===s){const f=r=>r.reduce((a,x)=>a+x.pts+x.bonus,0);if(f(S.old.rows)>f(rows)){S.log=S.log.filter(x=>x.s!==s).concat(S.old.rows);kept=true}S.old=null}
  if(pass)S.badges[s]=1;track();show('level');
  if(pass){
    sec.innerHTML=`<div class="bigbadge">${im(L.bi,'huge')}</div><h2>${praise()}</h2><p>${S.g==='m'?'حصلت':'حصلتِ'} على شارة «${bn(s)}»!${last?`<br><b>${S.g==='m'?'أنت الآن حارس':'أنتِ الآن حارسة'} الدرع الأمني! 🏆</b>`:''}</p><p>نقاطك الآن: <b>${total()}</b></p>${kept?'<p>احتفظنا بنتيجتك الأفضل 👍</p>':''}<button id="cont" class="green">${S.badges.every(Boolean)?'اعرض لوحة إنجازاتي 📊':'المرحلة التالية ◀'}</button>`;confetti();sfx.badge();
  }else{
    sec.innerHTML=`<div class="bigbadge" style="filter:grayscale(1) opacity(.4);animation:none">${im(L.bi,'huge')}</div><h2>${oops()}</h2><p>${S.g==='m'?`جمعت ${got} من ${max} نقطة. تحتاج نصف النقاط على الأقل لتفتح شارة «${bn(s)}». حاول مرة أخرى!`:`جمعتِ ${got} من ${max} نقطة. تحتاجين نصف النقاط على الأقل لتفتحي شارة «${bn(s)}». حاولي مرة أخرى!`}</p><button id="cont" class="purple">أعد المحاولة 🔄</button>`;sfx.wrong();
  }
  $('#cont').onclick=()=>{if(!pass){S.log=S.log.filter(x=>x.s!==s);S.qi=Q.findIndex(x=>x.s===s);show('game');loadQ();return}nextStage()};
}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<36;i++){const s=document.createElement('span');s.className='conf';s.textContent=['🎉','⭐','✨','🛡️','🏆'][i%5];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.append(s);setTimeout(()=>s.remove(),4000)}}

/* ============ شهادة التقدير ============ */
function buildCert(tot,hero){
  const f=S.g==='f',d=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}),BF=['المستكشفة الذكية','خبيرة الحماية','حارسة الأمان الرقمي','حارسة الدرع الأمني'],got=ST.map((L,i)=>({L,i})).filter(x=>S.badges[x.i]);
  $('#certbox').innerHTML=`<div class="dip"><div class="dip-in"><img src="${IC.shield}" width="70" alt=""><h1>شهادة تقدير</h1><div class="sub">${hero?(f?'حارسة الدرع الأمني':'حارس الدرع الأمني'):'مغامرة حارس العالم الرقمي'}</div><p>تُمنح هذه الشهادة إلى ${f?'البطلة':'البطل'}</p><div class="nm">${esc(S.name)}</div>
  <p>تقديراً ${f?'لاجتيازها':'لاجتيازه'} تحديات المواطنة الرقمية والأمان، ${f?'وحصولها':'وحصوله'} على ${tot} نقطة${got.length?' والشارات التالية:':'.'}</p>
  <div class="bds">${got.map(({L,i})=>`<div class="b"><i><img src="${IC[L.bi]}" alt=""></i><span>${f?BF[i]:L.b}</span></div>`).join('')}</div>
  <div class="sig"><div>المعلم${f?'ة':''}</div><div>${d}</div><div>إدارة المدرسة</div></div></div></div>`;
}

/* ============ لوحة المتابعة ============ */
function dashboard(){
  const tot=total(),hero=tot>=100&&S.badges.every(Boolean);
  let lb=[];try{lb=JSON.parse(localStorage.getItem('dg_lb')||'[]')}catch(e){}
  S.sid=S.sid||Date.now();lb=lb.filter(x=>x.id!==S.sid);lb.push({n:S.name,p:tot,id:S.sid});lb.sort((a,b)=>b.p-a.p);lb=lb.slice(0,8);try{localStorage.setItem('dg_lb',JSON.stringify(lb))}catch(e){}
  const col=['var(--blue)','var(--purple)','var(--green)','#f08a24'];
  const sk=ST.map((L,i)=>{const r=S.log.filter(x=>x.s===i),g=r.reduce((a,x)=>a+x.pts,0),m=r.reduce((a,x)=>a+x.max,0);return{n:L.sk,g,m,p:m?Math.round(g/m*100):0,c:col[i]}});
  const G=sk.reduce((a,x)=>a+x.g,0),M=sk.reduce((a,x)=>a+x.m,0),pct=M?Math.round(G/M*100):0,mis=S.log.filter(x=>!x.ok);
  $('#s-dash').innerHTML=`
  <div class="card" style="text-align:center"><h1 style="font-size:2rem">📊 لوحة إنجازاتي</h1><p>${S.g==='m'?'البطل':'البطلة'} <b>${esc(S.name)}</b></p>
   <div class="donut" style="background:conic-gradient(var(--green) ${pct*3.6}deg,var(--line) 0)"><span>${pct}%</span></div>
   <div class="pts" style="font-size:2.2rem">⭐ ${tot} نقطة</div>
   <div>${ST.map((L,i)=>`<div class="bd ${S.badges[i]?'on':''}">${im(L.bi)}<br>${bn(i)}</div>`).join('')}</div>
   <p style="color:var(--mute)">${S.badges.filter(Boolean).length} من ٤ شارات مكتسبة</p></div>
  <div class="card"><h2>💪 نقاط القوة والضعف</h2>${sk.map(s=>`<div class="sk"><b>${s.n}</b> — ${s.p}% (${s.g}/${s.m})<div class="track"><i style="width:${s.p}%;background:${s.c}"></i></div></div>`).join('')}
   <p>✅ نقاط القوة: ${sk.filter(s=>s.p>=70).map(s=>s.n).join('، ')||gz('واصل التدريب!')}</p><p>🎯 تحتاج تدريباً في: ${sk.filter(s=>s.p<70).map(s=>s.n).join('، ')||'لا شيء، أداء رائع!'}</p></div>
  <div class="card"><h2>🧩 أخطاؤك بالتفصيل</h2>${mis.length?mis.map(m=>`<div class="mis"><b>${m.title}</b><br>الصواب: ${m.ans}<br><small>${m.exp}</small></div>`).join(''):'<p>لم تخطئ في أي سؤال! 🌟</p>'}</div>
  <div class="card"><h2>🏆 أبطال الأمان الرقمي</h2><ol class="lb">${lb.map((x,i)=>`<li class="${x.id===S.sid?'me':''}"><span>${i+1}. ${esc(x.n)}</span><span>${x.p} نقطة</span></li>`).join('')}</ol><small style="color:var(--mute)">اللوحة محفوظة على هذا الجهاز فقط.</small></div>
  <div class="card" style="text-align:center">${hero?`${im('trophy','big')}<h2>وسام «البطل الرقمي للمدرسة»</h2><p>${S.g==='m'?'جمعت':'جمعتِ'} ١٠٠ نقطة والشارات الأربع. اسمك في رأس لوحة المتصدرين!</p>`:`<h2>🎁 المكافأة الختامية</h2><p>${gz('اجمع')} ١٠٠ نقطة والشارات الأربع ${S.g==='m'?'لتنال':'لتنالي'} وسام «البطل الرقمي للمدرسة».</p>`}
   <p><button id="pr" class="purple">اطبع شهادة التقدير 🖨️</button> <button id="again" class="green">العب من جديد 🔄</button></p></div>`;
  track();show('dash');$('#pr').onclick=()=>{buildCert(tot,hero);window.print()};
  $('#again').onclick=()=>{S.log=[];S.badges=[0,0,0,0];S.sid=0;S.st=0;$('#s-dash').innerHTML='';show('start')};if(hero)confetti();
}
</script>
</body>
</html>
